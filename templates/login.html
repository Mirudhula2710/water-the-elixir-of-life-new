{% extends 'base.html' %}
{% block title %}Login - Campus Water System{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white shadow-xl rounded-lg overflow-hidden border border-gray-100">
        <div class="bg-brand-500 text-white p-6 text-center">
            <div class="inline-block bg-white p-3 rounded-full text-brand-600 mb-3 shadow-sm">
                <i class="fa-solid fa-water text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold">Welcome Back</h2>
            <p class="text-brand-100 text-sm mt-1">Sign in to your account</p>
        </div>
        <div class="p-8">
            <form method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2"><i class="fa-solid fa-user text-gray-400 mr-2"></i>Username</label>
                    <input type="text" name="username" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-brand-500 focus:border-brand-500 outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2"><i class="fa-solid fa-lock text-gray-400 mr-2"></i>Password</label>
                    <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-brand-500 focus:border-brand-500 outline-none transition-colors">
                </div>
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-brand-600 hover:bg-brand-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors">
                    Login
                </button>
            </form>
            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-sm text-gray-500 mb-3 font-medium">Demo Accounts (Password: password)</p>
                <div class="flex justify-center gap-2 flex-wrap">
                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-800 shadow-sm">manager</span>
                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-800 shadow-sm">worker1</span>
                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-purple-100 text-purple-800 shadow-sm">student1</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
